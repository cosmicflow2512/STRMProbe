name: Build & push STRMProbe mod

on:
  push:
    branches: [main]
    paths:
      - mod/**
      - src/**
      - .github/workflows/build-mod.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # required to push to GHCR
    steps:
      - uses: actions/checkout@v4

      # Stage the wrapper + init script from src/ into mod/root/ (single source
      # of truth). Same script the local mod/build.sh uses.
      - name: Stage mod files
        run: bash mod/stage.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner for image name
        id: img
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build & push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: mod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.owner }}/strmprobe-mod:latest
            ghcr.io/${{ steps.img.outputs.owner }}/strmprobe-mod:${{ github.sha }}
