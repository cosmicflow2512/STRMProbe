# Example Sonarr (LinuxServer.io) with STRMProbe.
#
# Recommended: activate STRMProbe via the Docker mod — just the DOCKER_MODS env
# var below. No volume mounts, symlinks or pre-seeding needed.
#
# Pin a release tag (…/strmprobe-mod:vX.Y.Z) in production instead of :latest.
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - DOCKER_MODS=ghcr.io/cosmicflow2512/strmprobe-mod:latest
      # Optional: enable the wrapper debug log at /config/logs/ffprobe-wrapper.log
      - STRMPROBE_LOG=1
    volumes:
      - /srv/sonarr:/config
      - /path/to/library/tv:/tv
    ports:
      - "8989:8989"
    restart: unless-stopped

    # --- Manual (non-mod) alternative: drop the DOCKER_MODS line above and mount
    #     the scripts yourself (see README "Manual installation"). The init script
    #     goes at the container root /custom-cont-init.d (NOT under /config) and
    #     must be root:root + executable, or LSIO ignores it.
    # volumes:
    #   - /srv/sonarr:/config
    #   - ./src/strmprobe-init.sh:/custom-cont-init.d/99-strmprobe:ro
    #   - ./src/ffprobe-wrapper.sh:/config/strmprobe/ffprobe-wrapper.sh:ro
    #   # Optional pre-seeded binary (otherwise auto-downloaded on first start):
    #   # - ./bin/ffprobe-full:/config/bin/ffprobe-full:ro
    #   - /path/to/library/tv:/tv
