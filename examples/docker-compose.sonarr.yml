# Example Sonarr (LinuxServer.io) service wired up for STRMProbe.
#
# Three mounts make the wrapper work:
#   1. the init script  -> /config/custom-cont-init.d/99-strmprobe
#   2. the wrapper       -> /config/strmprobe/ffprobe-wrapper.sh
#   3. (optional) a pre-seeded ffprobe-full -> /config/bin/ffprobe-full
#      If omitted, the init script auto-downloads it on first start (needs network).
#
# Adjust the host paths to where you cloned this repo and your media library.
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # Optional: enable the wrapper's debug log at /config/logs/ffprobe-wrapper.log
      - STRMPROBE_LOG=1
    volumes:
      - /srv/sonarr:/config
      # --- STRMProbe artifacts ---
      - ./src/strmprobe-init.sh:/config/custom-cont-init.d/99-strmprobe:ro
      - ./src/ffprobe-wrapper.sh:/config/strmprobe/ffprobe-wrapper.sh:ro
      # Optional pre-seeded binary (otherwise auto-downloaded on first start):
      # - ./bin/ffprobe-full:/config/bin/ffprobe-full:ro
      # --- media ---
      - /path/to/library/tv:/tv
    ports:
      - "8989:8989"
    restart: unless-stopped
