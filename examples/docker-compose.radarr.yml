# Example Radarr (LinuxServer.io) with STRMProbe.
# Same as the Sonarr example bar the image, name, port and media mount.
# See docker-compose.sonarr.yml for the manual (non-mod) alternative.
services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - DOCKER_MODS=ghcr.io/cosmicflow2512/strmprobe-mod:latest
      - STRMPROBE_LOG=1
    volumes:
      - /srv/radarr:/config
      - /path/to/library/movies:/movies
    ports:
      - "7878:7878"
    restart: unless-stopped
